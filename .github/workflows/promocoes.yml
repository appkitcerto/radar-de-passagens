name: Atualizar promoções

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: promocoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ler os feeds
        run: python scripts/fetch_feeds.py promocoes.json
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add promocoes.json
          git diff --cached --quiet || git commit -m "Atualiza promoções"
          git push
